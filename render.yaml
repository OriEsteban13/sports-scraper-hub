services:
  - type: web
    name: scrpling
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard          # Standard plan needed for Playwright (512 MB RAM minimum)
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false         # Set manually in Render dashboard → paste Supabase connection string
      - key: SUPABASE_URL
        sync: false         # https://xxxxxxxxxxxx.supabase.co
      - key: SUPABASE_KEY
        sync: false         # service_role key (from Supabase → Settings → API)
      - key: SUPABASE_BUCKET
        value: media
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
